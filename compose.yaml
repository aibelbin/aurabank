name: aurabank

services:
  # Tailscale as a sidecar, one node per app.
  #
  # This is what makes two apps possible at all. Funnel only ever listens on
  # 443, 8443 or 10000, and on this host 443 and 8443 already belong to other
  # services — one free port between two apps. A sidecar gives each app its
  # own node, its own hostname and therefore its own 443, so neither has to
  # queue for a port and nothing else on the machine is disturbed.
  #
  # It is also the tighter arrangement: the app publishes no host port at all
  # and is reachable only from inside this namespace. Same pattern as tikwah.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: aurabank-tailscale
    hostname: aurabank
    restart: unless-stopped
    environment:
      # Optional. With a key the node joins unattended; without one,
      # containerboot prints a login URL to the logs to be visited once.
      # Either way the node identity is kept on the volume below, so this is
      # a first-run concern only. Never committed — it lives in .env.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: aurabank
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking: this node serves, it never routes or exits, so
      # it needs neither NET_ADMIN nor a TUN device.
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      # The whole workspace, because the app depends on packages/design.
      context: .
      dockerfile: apps/landing/Dockerfile
    image: aurabank-web:latest
    container_name: aurabank-web
    restart: unless-stopped
    # No ports, on the host or anywhere else: the app shares the Tailscale
    # sidecar's network namespace, so Funnel reaches it on loopback and
    # nothing else can reach it at all.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      # The waitlist database is the only state; it lives on the volume below.
      WAITLIST_DB_PATH: /app/data/waitlist.db
    volumes:
      # Named rather than bind-mounted so the database survives image rebuilds
      # and is not exposed to the host filesystem's permissions.
      - waitlist-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
      # Next writes its runtime caches here; nothing in it needs to persist.
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    # A Node server needs more headroom than tikwah's nginx.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Verified snapshots of the waitlist, on a schedule. Runs from the app's own
  # image, so there is no second toolchain and nothing to fetch at start.
  #
  # Snapshots land on a host directory rather than a Docker volume on purpose:
  # `docker compose down -v` and a corrupted Docker state both destroy volumes,
  # and a backup that dies with the thing it is backing up is not a backup.
  backup:
    image: aurabank-web:latest
    container_name: aurabank-backup
    restart: unless-stopped
    depends_on:
      - web
    command: ["node", "scripts/backup-waitlist.mjs"]
    environment:
      WAITLIST_DB_PATH: /app/data/waitlist.db
      BACKUP_DIR: /app/backups
      BACKUP_INTERVAL_MINUTES: "60"
      # Seven days of hourly snapshots. Each is a few kilobytes.
      BACKUP_KEEP: "168"
    volumes:
      - waitlist-data:/app/data
      - ./backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Live waitlist applications. Snapshots of this land in ./backups on the host.
  waitlist-data:
  # The Tailscale node's identity. Without this the node re-authenticates on
  # every restart and its hostname drifts, which would change the public URL.
  ts-state:
